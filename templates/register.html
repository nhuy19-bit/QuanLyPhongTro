<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Quản lý phòng trọ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Đăng ký tài khoản</h2>
                        <p class="text-muted">
                            Tạo tài khoản để sử dụng hệ thống
                        </p>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" autocomplete="off">

                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                name="ho_ten"
                                class="form-control"
                                placeholder="Nhập họ và tên"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Tên đăng nhập
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Nhập tên đăng nhập"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Nhập email"
                                autocomplete="off"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <input
                                type="text"
                                name="so_dien_thoai"
                                class="form-control"
                                placeholder="Nhập số điện thoại"
                                autocomplete="off"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Vai trò
                            </label>

                            <select
                                name="vai_tro"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    -- Chọn vai trò --
                                </option>

                                <option value="chu_tro">
                                    Chủ trọ
                                </option>

                                <option value="nguoi_thue">
                                    Người thuê
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Mật khẩu
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Nhập mật khẩu"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Xác nhận mật khẩu
                            </label>

                            <input
                                type="password"
                                name="password2"
                                class="form-control"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Đăng ký
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">
                            Đã có tài khoản?
                        </span>

                        <a
                            href="{% url 'login' %}"
                            class="text-decoration-none"
                        >
                            Đăng nhập
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a
                            href="{% url 'home' %}"
                            class="text-decoration-none"
                        >
                            ← Quay về trang chủ
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
