<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <title>Xóa phòng</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-md-5">


            <div class="card shadow">


                <div class="card-body p-4 text-center">


                    <h3 class="mb-4 text-danger">
                        Xóa phòng
                    </h3>


                    <p>
                        Bạn có chắc muốn xóa phòng:
                    </p>


                    <h5 class="fw-bold">
                        {{ phong.ten_phong }}
                    </h5>


                    <form method="POST">

                        {% csrf_token %}


                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Xác nhận xóa
                        </button>


                        <a
                            href="{% url 'phong_list' %}"
                            class="btn btn-secondary"
                        >
                            Hủy
                        </a>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
