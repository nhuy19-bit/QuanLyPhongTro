<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý phòng trọ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-navy: #0f172a;
            --admin-blue: #1d4ed8;
            --admin-muted: #64748b;
        }
        body { background: #f8fafc !important; }
        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05) !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--admin-navy), var(--admin-blue));
            border-color: var(--admin-blue);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1e293b, #2563eb);
            border-color: #2563eb;
        }
        a { color: var(--admin-blue); }
        a:hover { color: #1e3a8a; }
        .form-control:focus {
            border-color: var(--admin-blue);
            box-shadow: 0 0 0 0.25rem rgba(29, 78, 216, 0.15);
        }
    </style>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center fw-bold mb-4">Đăng nhập</h2>
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST" autocomplete="on">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label" for="tenant-phone">Số điện thoại</label>
                            <input id="tenant-phone" type="tel" name="username" class="form-control"
                                   placeholder="Nhập số điện thoại" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="tenant-password">Mật khẩu</label>
                            <input id="tenant-password" type="password" name="password" class="form-control"
                                   placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                    </form>
                    <div class="text-center mt-2">
                        <a href="{% url 'home' %}" class="text-decoration-none">← Quay về trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
