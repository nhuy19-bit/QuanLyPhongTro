```html
{% extends "admin/change_form.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        :root {
            --primary: #159b96;
            --primary-dark: #108580;
            --primary-light: #e8fbf9;
            --page-bg: #f4f7fb;
            --card-bg: #ffffff;
            --border: #e5ebf1;
            --text: #263548;
            --muted: #8491a3;
        }

        body {
            background: var(--page-bg);
            color: var(--text);
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px 30px;
        }

        #content > h1 {
            display: none !important;
        }

        #content h1 {
            color: #1f2d3d;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 18px;
            padding: 18px 22px;
            background: #edf2f2;
            border: 1px solid #dfe7ea;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        }

        #content-main {
            width: 100%;
        }

        #content-main .module,
        #content-main fieldset {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(30, 50, 70, 0.05);
        }

        #content-main .module h2,
        #content-main fieldset h2 {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 16px 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .form-row {
            padding: 18px 20px;
            border-bottom: 1px solid #edf0f4;
        }

        .aligned label {
            color: #344054;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="url"],
        input[type="date"],
        select,
        textarea {
            border: 1px solid #d8e1e9;
            border-radius: 8px;
            padding: 10px 12px;
            min-height: 40px;
            max-width: 100%;
            box-sizing: border-box;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #35c9c3;
            outline: 2px solid rgba(53, 201, 195, 0.15);
        }

        .submit-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-top: 24px;
        }

        .submit-row input,
        .submit-row button {
            border: none;
            border-radius: 8px;
            padding: 11px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-row input[name="_save"] {
            background: var(--primary);
            color: white;
        }

        .submit-row input[name="_save"]:hover {
            background: var(--primary-dark);
        }

        .submit-row input[name="_addanother"] {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .submit-row input[name="_addanother"]:hover {
            background: #d5f5f2;
        }

        .submit-row input[name="_continue"] {
            background: #edf2f7;
            color: #344054;
        }

        .submit-row input[name="_continue"]:hover {
            background: #dfe7ef;
        }

        .help,
        .helptext {
            color: var(--muted);
        }

        .errorlist {
            color: #dc3545;
        }

        /* Thanh trên giống với base_site.html */
        #header {
            height: 68px;
            min-height: 68px;
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
            padding: 0 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        #branding {
            display: flex;
            align-items: center;
            height: 68px;
        }

        #branding a {
            color: white !important;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none !important;
        }

        #user-tools {
            height: 68px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 12px;
        }

        #user-tools a,
        #user-tools a:link,
        #user-tools a:visited {
            color: rgba(255, 255, 255, 0.95) !important;
            text-decoration: none !important;
            padding: 8px 12px;
            border-radius: 8px;
        }

        #user-tools a:hover {
            color: white !important;
            background: rgba(255, 255, 255, 0.08);
        }

        #nav-breadcrumbs {
            display: block;
            min-height: 40px;
            padding: 10px 20px;
            box-sizing: border-box;
            background: #244957;
            border: none;
            color: white;
        }

        #nav-breadcrumbs a {
            color: white !important;
        }

        /* Ẩn chữ ở dưới bên trái dưới thanh header */
        #nav-breadcrumbs {
            display: none !important;
        }

        @media (max-width: 768px) {
            #content {
                padding: 15px;
            }

            #content h1 {
                font-size: 22px;
            }

            .form-row {
                padding: 14px;
            }
        }
        
    </style>
{% endblock %}
```
