<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <title>
        {% if phong %}
            Sửa phòng
        {% else %}
            Thêm phòng
        {% endif %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">


            <div class="card shadow">


                <div class="card-body p-4">


                    <h2 class="text-center mb-4">

                        {% if phong %}
                            Sửa thông tin phòng
                        {% else %}
                            Thêm phòng mới
                        {% endif %}

                    </h2>



                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Tên phòng
                            </label>

                            <input
                                type="text"
                                name="ten_phong"
                                class="form-control"
                                value="{{ phong.ten_phong|default:'' }}"
                                placeholder="Ví dụ: P101"
                                required
                            >

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Giá phòng
                            </label>

                            <input
                                type="number"
                                name="gia_phong"
                                class="form-control"
                                value="{{ phong.gia_phong|default:'' }}"
                                placeholder="Ví dụ: 3000000"
                                required
                            >

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Diện tích (m²)
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="dien_tich"
                                class="form-control"
                                value="{{ phong.dien_tich|default:'' }}"
                                placeholder="Ví dụ: 25"
                                required
                            >

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Trạng thái
                            </label>


                            <select
                                name="trang_thai"
                                class="form-select"
                            >

                                <option value="trong"
                                {% if phong.trang_thai == 'trong' %}
                                    selected
                                {% endif %}
                                >
                                    Phòng trống
                                </option>


                                <option value="dang_thue"
                                {% if phong.trang_thai == 'dang_thue' %}
                                    selected
                                {% endif %}
                                >
                                    Đang thuê
                                </option>


                                <option value="bao_tri"
                                {% if phong.trang_thai == 'bao_tri' %}
                                    selected
                                {% endif %}
                                >
                                    Đang bảo trì
                                </option>


                            </select>

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Mô tả
                            </label>


                            <textarea
                                name="mo_ta"
                                class="form-control"
                                rows="3"
                            >{{ phong.mo_ta|default:'' }}</textarea>


                        </div>




                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >

                            Lưu

                        </button>


                    </form>



                    <div class="text-center mt-3">

                        <a href="{% url 'phong_list' %}">
                            ← Quay lại danh sách phòng
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


</div>


</body>
</html>
