<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý phòng trọ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --admin-navy: #0f172a;
            --admin-blue: #1d4ed8;
            --admin-muted: #64748b;
        }

        body {
            background: #f8fafc !important;
        }

        .navbar {
            background: linear-gradient(135deg, var(--admin-navy) 0%, var(--admin-blue) 100%) !important;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(148, 163, 184, 0.18) !important;
            border-radius: 16px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--admin-navy), var(--admin-blue));
            border-color: var(--admin-blue);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1e293b, #2563eb);
            border-color: #2563eb;
        }

        .text-muted {
            color: var(--admin-muted) !important;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🏠 Quản Lý Phòng Trọ
        </a>

        <div>
            <a href="{% url 'login' %}" class="btn btn-light me-2">
                Đăng nhập
            </a>
        </div>

    </div>
</nav>


<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 text-center">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-5">

                        <div style="font-size: 80px;">
                            🏠
                        </div>

                        <h1 class="fw-bold mt-3">
                            Hệ thống quản lý phòng trọ
                        </h1>

                        <p class="text-muted mt-3">
                            Hỗ trợ quản lý phòng trọ,
                            người thuê, hợp đồng,
                            điện nước và thanh toán.
                        </p>

                        <div class="mt-4">

                            <a
                                href="{% url 'login' %}"
                                class="btn btn-primary btn-lg me-2"
                            >
                                Đăng nhập
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>


<footer class="text-center text-muted py-4">

    <small>
        © 2026 - Hệ thống quản lý phòng trọ
    </small>

</footer>

</body>
</html>
